[env:adafruit_magtag29_esp32s2]
extends = esp32s2_base
board = adafruit_magtag29_esp32s2
; board_build.mcu = esp32s2

board_level = extra
; board_build.arduino.memory_type = dio_opi
; board_build.f_cpu = 240000000L
upload_protocol = esptool
;upload_port = /dev/ttyACM1
upload_speed = 921600
lib_deps =
  ${esp32s2_base.lib_deps}
  # renovate: datasource=custom.pio depName=GxEPD2 packageName=zinggjm/library/GxEPD2
  zinggjm/GxEPD2@1.6.9
  USB

build_unflags =
  ${esp32s2_base.build_unflags}
  -DARDUINO_USB_MODE=1

build_flags =
  ${esp32s2_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32s2/adafruit_magtag
  -Dmy
  -DEINK_DISPLAY_MODEL=GxEPD2_290_T94_V2
  -DEINK_WIDTH=296
  -DEINK_HEIGHT=128
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DARDUINO_USB_CDC_ON_BOOT=1
